# Клиент Light Keeper: статика + прокси на игровой сервер.

# Для WebSocket: передаём заголовок Upgrade, если он есть.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # /api/health → api:3000/health, /api/ws → api:3000/ws (WebSocket).
  location /api/ {
    proxy_pass http://api:3000/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Партия может длиться долго — не рвать тихое соединение.
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  # Файлы сборки с хешем в имени — кэшируем надолго.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
